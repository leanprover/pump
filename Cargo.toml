[package]
name = "pump"
version = "0.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["json"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
clap = { version = "4.6.7", features = ["derive", "deprecated"] }
env_logger = "0.11.11"
jiff = { version = "0.2.38", features = ["serde"] }
log = "0.4.34"
num_cpus = "1.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"

[lints]
clippy.large_enum_variant = "allow"
